<!DOCTYPE html>
<html lang="Ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@1.0.15/destyle.css"/>
  <link rel="stylesheet" href="css/style.css">
  <!-- slickの読み込み -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
  <title>portfolio</title>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="header-logo"><a class="myprofile" href="#index.html">My Profile</a></h1>
      <nav id="menu">
        <ul class="menu-list">
          <li>
            <a class="menu-about" href="#about">About</a>     
          </li>
          <li>
            <a class="menu-works" href="#works">Works</a> 
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <!-- カルーセル -->
    <div id="carousel-section">
      <ul class="carousel">
        <li>
          <img class="carouselImg" src="images/main.png">
        </li>
        <li>
          <img class="carouselImg" src="images/main2.png">
        </li>
        <li>
          <img class="carouselImg" src="images/main3.png">
        </li>
      </ul>
    </div>
    <!-- <img id="main-visual" src="images/main.png" alt="メイン画像" width="960" height="400"> -->
    <div class="main-inner">
      <section id="about">
      <h2>About</h2>
        <div class="about">
          <img class="about-visual" src="images/about.png" alt="プロフィール画像" width="142" height="142">
          <div class="about-profile">  
            <h3>Kazuki Asahina</h3>
            <ul>
              <li><p>・25歳 長野県佐久市出身</p></li>
              <li><p>・ソフトウェア業界でマーケティングに従事</p></li>
              <li><p>・趣味はカメラ、愛機はCanon</p></li>
              <li><p>・自然を撮影をするのが好きで、海や山によく行く</p></li>
            </ul>
          </div>
        </div>
      </section>
      <section id="works">
        <h2>Works</h2>
        <ul class="works">
          <li class="works-item">
            <img src="images/works1.png" alt="新潟" width="179" height="134">
            <p>新潟に訪れた際に、日本海の雄大さを魅了されて撮影した1枚</p>
          </li>
          <li class="works-item">
            <img src="images/works2.png" alt="長野" width="179" height="134">
            <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
          </li>
          <li class="works-item">
            <img src="images/works3.png" alt="京都" width="179" height="134">
            <p>京都で撮影した、明け方の古き良き日本の町並み</p>
          </li>
        </ul>
      </section>
    </div>
  </main>
  <a id="back-btn" href="#">TOP</a>
  <div class="modal">
    <img src="" class="big-img">
    <a class="close-btn">✖</a>
  </div>

  <footer><p>&copy; MyProfile. All rights reserved.</p></footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- slickの読み込み -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
